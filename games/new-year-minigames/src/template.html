<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Year Minigames</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#dfeaf6;--frame:#1d2433;--text:#2b3150;--muted:#5f6c92;--key:#ffffff;--keyText:#1d2433;--accent:#f2a33a;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1630;--frame:#050a1a;--text:#e3eaf8;--muted:#8f9cc4;--key:#1f2b52;--keyText:#e3eaf8;}}
:root[data-theme="dark"]{--bg:#0e1630;--frame:#050a1a;--text:#e3eaf8;--muted:#8f9cc4;--key:#1f2b52;--keyText:#e3eaf8;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Pixelify Sans","Courier New",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.screen{background:var(--frame);padding:6px;border-radius:10px;box-shadow:0 0 0 2px var(--accent) inset, 0 10px 30px rgba(0,0,0,.25);max-width:100%}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;width:min(calc(100vw - 36px), calc((100vh - 150px) * 480 / 272), 1440px);aspect-ratio:480/272;height:auto}
.help{font-size:14px;color:var(--muted);text-align:center;max-width:72ch;line-height:1.5;margin:0}
.help kbd{font-family:inherit;background:var(--key);color:var(--keyText);border-radius:4px;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.pad{display:none;width:min(100%,720px);justify-content:space-between;align-items:center;gap:10px}
.pad .grp{display:flex;gap:10px}
.pad button{font:inherit;font-size:20px;width:64px;height:64px;border-radius:50%;border:none;background:var(--key);color:var(--keyText);box-shadow:0 4px 0 rgba(0,0,0,.25);touch-action:none}
.pad button.wide{border-radius:18px;width:78px;font-size:15px}
.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);background:var(--accent);color:#1d2433}
@media (pointer:coarse){.pad{display:flex}.help{display:none}canvas{width:min(calc(100vw - 36px), calc((100vh - 190px) * 480 / 272))}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style></head><body>
<div class="screen"><canvas id="game" width="480" height="272" aria-label="New Year Minigames platformer game" tabindex="0"></canvas></div>
<p class="help"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>Z</kbd>/<kbd>Space</kbd> jump (hold for height) · <kbd>X</kbd>/<kbd>Shift</kbd> run · <kbd>↑</kbd> enter door · <kbd>R</kbd> restart room · <kbd>P</kbd> pause · <kbd>M</kbd> mute</p>
<div class="pad" aria-label="Touch controls">
 <div class="grp"><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button><button data-k="up" aria-label="Enter door">▲</button></div>
 <div class="grp"><button class="wide" data-k="restart" aria-label="Restart room">↺</button><button class="wide" data-k="run" aria-label="Run">Run</button><button data-k="jump" aria-label="Jump">⤒</button></div>
</div>
<script>const LEVELS=__LEVELS__;</script>
<script>__ENGINE__</script>
</body></html>
