name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly sweep in addition to on every push/PR, in case a vulnerable pattern is
    # only newly flagged by an updated CodeQL query pack rather than a code change.
    - cron: '19 4 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # Required to upload results to the repo's Security tab.
      security-events: write
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Covers both the Vite/React frontend (src/) and the Vercel serverless
        # functions (api/) — both are plain JavaScript.
        language: [ 'javascript-typescript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
